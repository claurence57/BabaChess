# Elo evaluation pool for scripts/elo_eval.sh
# Format: name|proto|cmd|options|nominal_elo
#
# Stockfish's UCI_Elo (1320..3190) is a self-consistent ladder, not an official
# CCRL rating: compare runs made with the same anchors, not across scales.
SF1800|uci|stockfish|option.UCI_LimitStrength=true option.UCI_Elo=1800 option.Threads=1|1800
SF2200|uci|stockfish|option.UCI_LimitStrength=true option.UCI_Elo=2200 option.Threads=1|2200
SF2600|uci|stockfish|option.UCI_LimitStrength=true option.UCI_Elo=2600 option.Threads=1|2600
SF3000|uci|stockfish|option.UCI_LimitStrength=true option.UCI_Elo=3000 option.Threads=1|3000
#
# To widen the pool, add lines with `cmd` either on PATH or an absolute path
# (the nominal Elo of a non-Stockfish engine is a rough estimate on you):
# GNU2400|uci|/path/to/gnuchess_uci.sh||2400
# Fruit2400|uci|fruit||2400
# Crafty2300|xb|crafty||2300
