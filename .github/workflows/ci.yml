name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build (debug/release/portable) + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install GNAT toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnat gprbuild

      - name: Toolchain versions
        run: |
          gnat --version | head -1
          gprbuild --version | head -1

      # -cargs:ada -gnatwe turns every Ada warning into an error, so this step
      # fails on the first warning (debug already carries -gnatwa -gnatVa).
      - name: Build debug (warnings as errors)
        run: gprbuild -P babachess.gpr -XMode=debug -cargs:ada -gnatwe

      - name: Self-test (debug)
        run: ./bin/babachess --selftest

      - name: Build release
        run: |
          rm -rf obj
          gprbuild -P babachess.gpr -XMode=release

      - name: Benchmark depth 9 (release)
        run: ./bin/babachess --bench 9

      - name: Build portable (software PEXT fallback)
        run: |
          rm -rf obj
          gprbuild -P babachess.gpr -XMode=portable

      - name: Self-test (portable)
        run: ./bin/babachess --selftest
